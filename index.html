<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Road to Doomsday</title>
<meta name="theme-color" content="#F3EEE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A0B10" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Doomsday">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com/"><link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<style id="css">
:root{
  --bg:#F3EEE6; --ink:#1F1418; --muted:#6E5E62; --line:#D9CFC4;
  --seat:#7A1E2C; --gold:#B8862B; --done:#9A8F88; --card:#FFFBF5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A0B10; --ink:#F4E9DC; --muted:#B39A94; --line:#3A1D25;
    --seat:#C7384D; --gold:#E3B452; --done:#6B5A5C; --card:#24111A;
  }
}
:root[data-theme="dark"]{
  --bg:#1A0B10; --ink:#F4E9DC; --muted:#B39A94; --line:#3A1D25;
  --seat:#C7384D; --gold:#E3B452; --done:#6B5A5C; --card:#24111A;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;font-size:17px;line-height:1.4;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 48px}
.hero{padding:8px 0 20px;border-bottom:3px solid var(--ink)}
.days{font-family:Anton,Impact,"Arial Narrow Bold",sans-serif;font-size:clamp(84px,26vw,148px);line-height:.86;letter-spacing:.01em;color:var(--seat)}
.days small{display:block;font-family:"Barlow Semi Condensed",sans-serif;font-size:19px;letter-spacing:0;color:var(--ink);font-weight:600;margin-top:10px}
.sub{color:var(--muted);font-size:15px;margin:4px 0 0}
.now{margin:18px 0 0;padding:14px 16px;background:var(--card);border-left:6px solid var(--gold)}
.now .lbl{font-size:14px;color:var(--muted)}
.now .ttl{font-family:Anton,Impact,sans-serif;font-size:26px;line-height:1.1;margin-top:2px}
.pace{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:15px}
.pace b{font-size:20px;display:block;font-weight:700}
.bar{height:10px;background:var(--line);margin-top:16px;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--seat);display:block}
.bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.legend{font-size:13px;color:var(--muted);margin-top:6px}
ol{list-style:none;margin:8px 0 0;padding:0}
li.row{border-bottom:1px solid var(--line)}
button.item{all:unset;box-sizing:border-box;display:grid;grid-template-columns:40px 1fr 30px;gap:10px;align-items:center;width:100%;padding:12px 2px;cursor:pointer}
button.item:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-family:Anton,Impact,sans-serif;font-size:22px;color:var(--muted);text-align:right}
.t{font-weight:600;font-size:18px;line-height:1.2}
.meta{font-size:14px;color:var(--muted);margin-top:2px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 6px;margin-left:6px;border:1px solid currentColor}
.tag.key{color:var(--seat)} .tag.cut{color:var(--muted)} .tag.new{color:var(--gold)}
.box{width:26px;height:26px;border:2px solid var(--ink);display:grid;place-items:center;font-weight:700}
.row.done .t{color:var(--done);text-decoration:line-through;text-decoration-thickness:2px}
.row.done .box{background:var(--seat);border-color:var(--seat);color:#fff}
.row.next .num{color:var(--seat)}
li.mark{padding:10px 0 10px 50px;font-size:14px;font-weight:600;color:var(--gold);border-bottom:1px solid var(--line)}
li.mark.late{color:var(--seat)}
.foot{font-size:14px;color:var(--muted);margin-top:22px}
.status{position:fixed;right:12px;display:flex;gap:10px;align-items:center;pointer-events:none;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);font-size:13px;padding:6px 10px;opacity:0;transition:opacity .2s}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.tools button{all:unset;cursor:pointer;font-size:15px;font-weight:600;padding:8px 12px;border:2px solid var(--ink)}
.tools button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
.status.on{opacity:1;pointer-events:auto}
.status button{all:unset;cursor:pointer;font-weight:700;text-decoration:underline;color:var(--bg)}
.cinema{margin:14px 0 0;padding:12px 16px;border:2px solid var(--seat);font-size:15px}
.cinema b{color:var(--seat)}
.note{font-size:13px;color:var(--gold);margin-top:2px}
.row.opt .t{font-weight:500}
@media (prefers-reduced-motion: reduce){.status{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="status" id="status" role="status" aria-live="polite"></div>
<script type="application/json" id="state">{"watched":{"ca1":"2026-09-22","cm":"2026-09-22","im1":"2026-09-23","im2":"2026-09-23","loki1":"pre","loki2":"pre","sm1":"pre","sm2":"pre","sm3":"pre"},"updated":1790130000000}</script>
<script id="main">
(function(){
// [id, title, year, minutes, kind (u=new to you, r=rewatch, c=cinema), optional, note]
const LIST=[
["ca1","Captain America: The First Avenger",2011,124,"r"],
["cm","Captain Marvel",2019,123,"r"],
["im1","Iron Man",2008,126,"r"],
["im2","Iron Man 2",2010,124,"r"],
["hulk","The Incredible Hulk",2008,112,"r",0,"Brave New World picks up its story"],
["thor1","Thor",2011,115,"r"],
["av1","The Avengers",2012,143,"r"],
["thor2","Thor: The Dark World",2013,112,"r",1],
["im3","Iron Man 3",2013,130,"r"],
["ca2","Captain America: The Winter Soldier",2014,136,"r"],
["gg1","Guardians of the Galaxy",2014,121,"r"],
["gg2","Guardians of the Galaxy Vol. 2",2017,136,"r"],
["av2","Avengers: Age of Ultron",2015,141,"r"],
["am1","Ant-Man",2015,117,"r"],
["ca3","Captain America: Civil War",2016,147,"r"],
["bw","Black Widow",2021,134,"u",0,"Sets up Yelena for Thunderbolts*"],
["bp1","Black Panther",2018,134,"r"],
["sm1","Spider-Man: Homecoming",2017,133,"r"],
["ds1","Doctor Strange",2016,115,"r"],
["thor3","Thor: Ragnarok",2017,130,"r"],
["am2","Ant-Man and the Wasp",2018,118,"r"],
["av3","Avengers: Infinity War",2018,149,"r"],
["av4","Avengers Endgame: Encore",2026,186,"c",0,"New opening; IMAX or Infinity Vision sessions add a Doomsday scene"],
["fws","The Falcon and the Winter Soldier",2021,300,"u",0,"Series. Sam takes the shield; introduces John Walker"],
["loki1","Loki: Season 1",2021,300,"r"],
["sc","Shang-Chi and the Legend of the Ten Rings",2021,132,"r"],
["sm2","Spider-Man: Far From Home",2019,129,"r"],
["et","Eternals",2021,156,"r",1],
["sm3","Spider-Man: No Way Home",2021,148,"r"],
["ds2","Doctor Strange in the Multiverse of Madness",2022,126,"r"],
["bp2","Black Panther: Wakanda Forever",2022,161,"u"],
["thor4","Thor: Love and Thunder",2022,119,"u"],
["am3","Ant-Man and the Wasp: Quantumania",2023,124,"u"],
["gg3","Guardians of the Galaxy Vol. 3",2023,150,"u"],
["mv","The Marvels",2023,105,"u",0,"Mid-credits scene links the X-Men to the MCU"],
["loki2","Loki: Season 2",2023,300,"r"],
["xm1","X-Men",2000,104,"r"],
["xm2","X2",2003,134,"r"],
["dw","Deadpool & Wolverine",2024,128,"r"],
["ca4","Captain America: Brave New World",2025,118,"u"],
["tb","Thunderbolts*",2025,127,"u"],
["ff","The Fantastic Four: First Steps",2025,115,"u"],
["sm4","Spider-Man: Brand New Day",2026,150,"u",0,"Sony release, so not on Disney+. Catch a late cinema session or rent it digitally"]
];
const MARKS={bw:["2026-10-18","Checkpoint: Black Widow by Sunday 18 October"],fws:["2026-11-08","Checkpoint: Falcon and the Winter Soldier by Sunday 8 November"],mv:["2026-11-29","Checkpoint: all 2022–23 new-to-you films by Sunday 29 November"],sm4:["2026-12-16","Finish by Wednesday 16 December"]};
const START=new Date(2026,8,20), FINISH=new Date(2026,11,16), RELEASE=new Date(2026,11,17);
const NEW=LIST.filter(x=>x[4]==="u");
const LS="mcu-doomsday-tracker-v2";
let state=JSON.parse(document.getElementById("state").textContent);


function today(){const d=new Date();d.setHours(0,0,0,0);return d}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function hrs(m){return Math.round(m/6)/10}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function dayname(d){return d.toLocaleDateString("en-AU",{weekday:"long",day:"numeric",month:"long"})}

function render(){
  const t=today(), w=state.watched;
  const CORE=LIST.filter(x=>!x[5]&&w[x[0]]!=="pre");
  const TOTAL=CORE.reduce((a,x)=>a+x[3],0);
  const doneMin=CORE.reduce((a,x)=>a+(w[x[0]]?x[3]:0),0);
  const doneN=LIST.filter(x=>w[x[0]]).length;
  const newDone=NEW.filter(x=>w[x[0]]).length;
  const next=LIST.find(x=>!w[x[0]]&&!x[5]&&x[4]!=="c");
  const daysToRelease=Math.max(0,Math.round((RELEASE-t)/864e5));
  const span=(FINISH-START)/864e5, elapsed=Math.min(span,Math.max(0,(t-START)/864e5+1));
  const shouldMin=TOTAL*elapsed/span;
  const diffH=hrs(doneMin-shouldMin);
  const leftMin=TOTAL-doneMin, weeksLeft=Math.max(1/7,((FINISH-t)/864e5+1)/7);
  const pace=diffH>=0?`<b>${diffH} h ahead</b>of pace`:`<b>${Math.abs(diffH)} h behind</b>of pace`;
  const now=!next?`<div class="lbl">All done</div><div class="ttl">Book your Doomsday tickets</div>`
    :`<div class="lbl">Up next${next[4]==="u"?", new to you":""}</div><div class="ttl">${esc(next[1])}</div>`;
  const cinema=w.av4?"":`<div class="cinema"><b>In cinemas now: Avengers Endgame: Encore.</b> Rewatch, so see it whenever suits, but re-release runs are short. Book the IMAX session at Dendy Canberra to get the new Doomsday scene.</div>`;
  let h=`<header class="hero"><div class="days">${daysToRelease}<small>${daysToRelease===1?"day":"days"} until Avengers: Doomsday, ${dayname(RELEASE)}</small></div>
  <p class="sub">Story order. Tap a title when you've watched it. If you fall behind, cut rewatches, never the new-to-you ones.</p>
  <div class="now">${now}</div>${cinema}
  <div class="pace"><span><b>${newDone} / ${NEW.length}</b>new to you</span><span><b>${doneN} / ${LIST.length}</b>watched</span><span>${pace}</span><span><b>${hrs(leftMin/weeksLeft)} h</b>a week needed</span></div>
  <div class="bar" aria-hidden="true"><i style="width:${(doneMin/TOTAL*100).toFixed(1)}%"></i><u style="left:${Math.min(100,shouldMin/TOTAL*100).toFixed(1)}%"></u></div>
  <div class="legend">Bar shows hours watched, excluding optional titles. The black line is where you should be today.</div></header><ol>`;
  LIST.forEach((x,i)=>{
    const [id,title,yr,min,kind,opt,note]=x, d=w[id];
    let tags="";
    if(kind==="u")tags+=`<span class="tag new">New to you</span>`;
    if(kind==="c")tags+=`<span class="tag key">In cinemas</span>`;
    if(opt)tags+=`<span class="tag cut">Optional</span>`;
    const len=min>=240?"series, about "+hrs(min)+" h":Math.floor(min/60)+" h "+String(min%60).padStart(2,"0")+" m";
    const meta=`${yr}, ${len}${d==="pre"?", watched before this plan":d?", watched "+new Date(d+"T00:00").toLocaleDateString("en-AU",{day:"numeric",month:"short"}):""}`;
    h+=`<li class="row${d?" done":""}${next&&id===next[0]?" next":""}${opt?" opt":""}"><button class="item" data-id="${id}" aria-pressed="${!!d}">
      <span class="num">${i+1}</span><span><span class="t">${esc(title)}</span>${tags}<div class="meta">${meta}</div>${note&&!d?`<div class="note">${esc(note)}</div>`:""}</span><span class="box">${d?"&#10003;":""}</span></button></li>`;
    if(MARKS[id]){
      const idx=i, late=t>new Date(MARKS[id][0]+"T00:00")&&LIST.slice(0,idx+1).some(y=>y[4]==="u"&&!w[y[0]]);
      h+=`<li class="mark${late?" late":""}">${MARKS[id][1]}${late?", passed with new-to-you titles still unwatched":""}</li>`;
    }
  });
  h+=`</ol><p class="foot">About ${hrs(TOTAL)} hours of core viewing still counted toward pace, plus ${hrs(LIST.filter(x=>x[5]).reduce((a,x)=>a+x[3],0))} h optional. Titles watched before this plan are ticked and left out of the pace maths. Checkpoints only turn red if a new-to-you title is still unwatched. Ticks are saved on this phone only, so back them up now and then.</p><div class="tools"><button type="button" id="backup">Copy backup</button><button type="button" id="restore">Restore from backup</button></div><p class="foot"></p>`;
  document.getElementById("app").innerHTML=h;
}

function flash(msg,undo){
  const s=document.getElementById("status");s.textContent=msg;
  if(undo){const b=document.createElement("button");b.textContent="Undo";b.onclick=()=>{undo();s.classList.remove("on")};s.appendChild(b)}
  s.classList.add("on");clearTimeout(flash.t);flash.t=setTimeout(()=>s.classList.remove("on"),undo?5000:2200);
}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){flash("Couldn't save. Check Safari isn't in private mode.")}}
function schedule(msg,undo){
  saveLocal();
  flash(msg||"Saved",undo);
}
document.getElementById("app").addEventListener("click",e=>{
  const b=e.target.closest("button.item");if(!b)return;
  const id=b.dataset.id, x=LIST.find(y=>y[0]===id);
  if(state.watched[id]){
    const prev=state.watched[id];delete state.watched[id];state.updated=Date.now();render();
    schedule("Unticked "+x[1],()=>{state.watched[id]=prev;state.updated=Date.now();render();schedule()});
  }else{state.watched[id]=iso(today());state.updated=Date.now();render();schedule()}
});
try{const s=JSON.parse(localStorage.getItem(LS)||"null");if(s&&s.watched)state=s}catch(e){}
render();
document.getElementById("app").addEventListener("click",async e=>{
  if(e.target.id==="backup"){
    const txt=JSON.stringify(state);
    try{await navigator.clipboard.writeText(txt);flash("Backup copied. Paste it into Notes to keep it.")}
    catch(err){prompt("Copy this backup:",txt)}
  }
  if(e.target.id==="restore"){
    const txt=prompt("Paste your backup:");if(!txt)return;
    try{const s=JSON.parse(txt);if(!s||typeof s.watched!=="object")throw 0;state=s;saveLocal();render();flash("Backup restored")}
    catch(err){flash("That isn't a valid backup. Copy it again and paste the whole thing.")}
  }
});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();
</script>
</body>
</html>
